name: Feature request
description: Suggest something humpyard should do
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Check the [roadmap](https://humpyard.dev/roadmap/) first: it may already be planned.
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The situation and what is hard today, before any solution.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would you like it to do?
  - type: textarea
    id: alternatives
    attributes:
      label: What do you do today instead?
