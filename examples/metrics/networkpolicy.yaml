# Lets only the monitoring namespace reach the metrics port. /metrics on its own port is not on
# the public listener at all; this keeps other pods in the cluster off it too.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: humpyard-metrics-from-monitoring
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: humpyard
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - protocol: TCP
          port: 9100
